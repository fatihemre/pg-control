# Shared Patroni config for the dev cluster; per-node values come from PATRONI_* env vars
# (PATRONI_NAME, PATRONI_RESTAPI_CONNECT_ADDRESS, PATRONI_POSTGRESQL_CONNECT_ADDRESS).
scope: pgcontrol-dev
restapi:
  listen: 0.0.0.0:8008
  authentication:
    username: patroni
    password: patroni
etcd3:
  hosts: etcd:2379
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: logical
        shared_preload_libraries: pg_stat_statements
        max_connections: 100
        password_encryption: scram-sha-256
      pg_hba:
        - local all all trust
        - host all all 127.0.0.1/32 trust
        - host replication replicator 0.0.0.0/0 scram-sha-256
        - host all all 0.0.0.0/0 scram-sha-256
  initdb:
    - encoding: UTF8
    - data-checksums
  post_init: /usr/local/bin/post_init.sh
postgresql:
  listen: 0.0.0.0:5432
  data_dir: /data/pgdata
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /tmp/pgpass
  authentication:
    superuser:
      username: postgres
      password: postgres
    replication:
      username: replicator
      password: replicator
  parameters:
    unix_socket_directories: /var/run/postgresql
