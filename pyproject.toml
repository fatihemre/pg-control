[project]
name = "pgcontrol"
version = "0.1.0"
description = "Self-hosted PostgreSQL governance panel: users, roles, effective privileges, configuration, cluster"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fatih Emre", email = "fatihemreoner@gmail.com" }]
requires-python = ">=3.13"
keywords = ["postgresql", "postgres", "privileges", "roles", "grants", "patroni", "admin", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "cryptography>=43",
    "argon2-cffi>=23",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/fatihemre/pg-control"
Documentation = "https://github.com/fatihemre/pg-control#readme"
Changelog = "https://github.com/fatihemre/pg-control/blob/main/CHANGELOG.md"
Issues = "https://github.com/fatihemre/pg-control/issues"

[project.scripts]
pgcontrol = "pgcontrol.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgcontrol"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
