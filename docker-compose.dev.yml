# Development-only PostgreSQL instances (PG 14–18) on ports 7414–7418.
# Usage: docker compose -f docker-compose.dev.yml up -d
# Superuser: postgres / postgres. Seeded with the "reservations" sample (docker/dev-init).
# pg16-replica (7419) is a streaming standby of pg16 for the Replication page.
# patroni1/patroni2 (REST 7431/7432, PostgreSQL 7433/7434) form a Patroni cluster on etcd
# for the Cluster → Patroni page; REST auth patroni/patroni.
x-patroni: &patroni
  build:
    context: ./docker/dev-patroni
    additional_contexts:
      seed: ./docker/dev-init
  depends_on:
    etcd:
      condition: service_started
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 3s
    retries: 30

x-pg: &pg
  command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "wal_level=logical"]
  environment:
    POSTGRES_PASSWORD: postgres
  volumes:
    - ./docker/dev-init:/docker-entrypoint-initdb.d:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  pg14:
    <<: *pg
    image: postgres:14-alpine
    container_name: pgcontrol-dev-pg14
    ports: ["7414:5432"]
  pg15:
    <<: *pg
    image: postgres:15-alpine
    container_name: pgcontrol-dev-pg15
    ports: ["7415:5432"]
  pg16:
    <<: *pg
    image: postgres:16-alpine
    container_name: pgcontrol-dev-pg16
    ports: ["7416:5432"]
  pg17:
    <<: *pg
    image: postgres:17-alpine
    container_name: pgcontrol-dev-pg17
    ports: ["7417:5432"]
  pg18:
    <<: *pg
    image: postgres:18-alpine
    container_name: pgcontrol-dev-pg18
    ports: ["7418:5432"]
  pg16-replica:
    image: postgres:16-alpine
    container_name: pgcontrol-dev-pg16-replica
    depends_on:
      pg16:
        condition: service_healthy
    entrypoint: ["/entrypoint.sh"]
    environment:
      POSTGRES_PASSWORD: postgres
      PRIMARY_HOST: pg16
    volumes:
      - ./docker/dev-replica/entrypoint.sh:/entrypoint.sh:ro
    ports: ["7419:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: pgcontrol-dev-etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
  patroni1:
    <<: *patroni
    container_name: pgcontrol-dev-patroni1
    environment:
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: host.docker.internal:7431
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
    ports: ["7431:8008", "7433:5432"]
  patroni2:
    <<: *patroni
    container_name: pgcontrol-dev-patroni2
    environment:
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: host.docker.internal:7432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
    ports: ["7432:8008", "7434:5432"]
